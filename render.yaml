# Render Blueprint: one free Docker web service.
#   https://<name>.onrender.com/      -> landing page
#   https://<name>.onrender.com/app/  -> Retention Engine (password protected)
# Render > New > Blueprint > pick this repo. You'll be asked for APP_PASSWORD.
services:
  - type: web
    name: iv-retention
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Nairobi
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false            # entered in the Render dashboard, never stored in git
